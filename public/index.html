<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>ОКБ Альфа</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- notifications -->

    <div class="snackbar-centered">
      <div id="snackbar-fixed-container">
      </div>
    </div>
    
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.
      
      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.
        
        To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
  
    <script>
    async function create_script_element(content) {
      let script = document.createElement('script');
      script.innerHTML = content;
      script.onload = function () {
        console.log('js loaded!');
      };
      return script
    }

    async function create_css_element(content) {
      let css = document.createElement('style');
      css.innerHTML = content;
      css.onload = function () {
        console.log('css loaded!');
      };
      return css
    }

    async function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetch_resource({src, retry_count}) {
      try {
        let response = await fetch(src);
        let content = await response.text()
        return content;

      } catch (error) {
        if (retry_count <= 1) return error;
        await sleep(100);
        return await fetch_resource({ src, retry_count: retry_count - 1 });
      }
    }
    
    async function form_resource_tag (resource) {
      let tag_instance;
      let tag_content = await fetch_resource(resource)
      console.log(typeof tag_content);
      if (tag_content instanceof Error) {
        return `Cannot mount resource '${resource.type}' with URL '${resource.url}': ${tag_content.message}`
      }

      switch (resource.type) {
        case 'script':
          tag_instance = await create_script_element(tag_content)
          document.body.append(tag_instance)
          break;
        
        case 'link/css':
          tag_instance = await create_css_element(tag_content)
          document.head.append(tag_instance)
          break;

        default:
          break;
      }


      return `Resource '${resource.type}' with URL '${resource.url}' is mounted`
    }

    async function defer_resourse_load () {

      const resource_list = [
        {src: 'react_js_build', type: 'script', retry_count: 3},
        {src: 'react_css_build', type: 'link/css', retry_count: 3 },
      ]

      for (let index = 0; index < resource_list.length; index++) {
        const resource = resource_list[index];
        const resource_mount_response = await form_resource_tag(resource)
        console.log(resource_mount_response);
      }
    }

    document.addEventListener("DOMContentLoaded", function (event) {
      defer_resourse_load()
    });
  </script>
  
</html>
