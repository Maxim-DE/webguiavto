version: '3.8'

services:
  react-app:
    image: m65535/web-node:16-alpine
    # container_name: "${PROJECT_NAME}-app"
    container_name: "webgui-app"
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      # Монтируем только исходный код
      - ./src:/app/src
      - ./public:/app/public
      # - ./package.json:/app/package.json
      # node_modules из контейнера в локальную папку
      # - ./node_modules:/app/node_modules
    environment:
      - DISABLE_ESLINT_PLUGIN=true
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run start:docker  # Только запуск!
    stdin_open: true
    tty: true


  # Рабочий вариант !!!!!!!!!!!
  # json-server:
