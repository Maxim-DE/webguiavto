version: '3.8'

services:
  react-app:
    image: m65535/web-node:16-alpine
    # container_name: "${PROJECT_NAME}-app"
    container_name: "webgui-app"
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      # Монтируем только исходный код
      - ./src:/app/src
      - ./public:/app/public
      - ./build_scripts:/app/build_scripts
      - ./gulpfile.js:/app/gulpfile.js                    # Для скриптов сборки
      - ./.git:/app/.git                                  # Для скриптов сборки
      - ./version_build.json:/app/version_build.json      # Для скриптов сборки
      
      # - ./package.json:/app/package.json
      # node_modules из контейнера в локальную папку
      # - ./node_modules:/app/node_modules
    environment:
      - DISABLE_ESLINT_PLUGIN=true
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run start:docker  # Только запуск!
    stdin_open: true
    tty: true

  json-server:
    image: m65535/web-json-server:1.0.0-beta.3
    working_dir: /data/    
    ports:
      - "4040:3001"
    volumes:
      - ./json-server/data/AVR-1000/db.json:/data/db.json
    environment:
      - CHOKIDAR_USEPOLLING=true    
    command: json-server --watch db.json --host 0.0.0.0 --port 3001
