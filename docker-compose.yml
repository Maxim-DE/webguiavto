  #     - ./json-server/data/AVR-1000/db.json:/data/db.json


  json-server:
    image: m65535/web-json-server:1.0.0-beta.3
    working_dir: /data/    
    ports:
      - "4040:3001"
    volumes:
      - ./json-server/data/AVR-1000/db.json:/data/db.json
    environment:
      - CHOKIDAR_USEPOLLING=true    
    command: json-server --watch db.json --host 0.0.0.0 --port 3001

